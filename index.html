  carFilter:d => { UI.carFilter = d.v; render(); },
  tab:d => { UI.tab[d.k] = d.v; UI.past = 'all'; render(); }, past:d => { UI.past = d.v; render(); }, view:d => { UI.view = d.v; render(); },
  calDay:d => { UI.calDate = d.k; UI.dateFilter = d.k; UI.calMonth = d.k.slice(0, 7); render(); },
  calToday:() => { UI.calDate = dkey(S.now); UI.calMonth = null; UI.dateFilter = null; render(); },
  calMonth:d => { const cur = UI.calMonth || (UI.calDate || dkey(S.now)).slice(0, 7); let [y, m] = cur.split('-').map(Number); m += +d.d; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; } UI.calMonth = `${y}-${pad(m)}`; render(); },
  calToggle:() => { UI.calOpen = !UI.calOpen; render(); }, clearDate:() => { UI.dateFilter = null; render(); },
  dConfirm:d => dConfirmFlow(d.id), dReject:d => dRejectFlow(d.id), dCancel:d => dCancelFlow(d.id), cCancel:d => cCancelFlow(d.id),
  cResched:d => { const r = R(d.id); if (r.rescheduled) return toast('You have already changed the time once. You can cancel and send a new request instead.'); const c = C(r.cid); if (!c.verified) return verifyModal(); if (c.restrictedUntil > S.now) return restrictedModal(c.restrictedUntil); booking(r.lid, r.id); },
  survey:d => surveyFlow(d.id), dispute:d => disputeFlow(d.id),
  bell:(d, el) => bellDrop(el),
  notif:d => { const n = S.notifs.find(x => x.id === d.id); n.read = true; save(); closeDrop(); render(); if (n.cta) runAct(n.cta); },
  markAll:() => { S.notifs.forEach(n => { if (n.to === myKey()) n.read = true; }); closeDrop(); commit(); },
  newListing:() => newListingFlow(), lEdit:d => editListingFlow(d.id), lStatus:d => listingStatusFlow(d.id, d.s), lDelete:d => deleteListingFlow(d.id), lRelist:d => relistFlow(d.id),
  perAdd:d => { const ps = UI.hoursDraft.weekly[d.w]; const last = ps[ps.length - 1]; ps.push([Math.min(last[1] + 120, 1380), Math.min(last[1] + 360, 1440)]); render(); },
  perDel:d => { UI.hoursDraft.weekly[d.w].splice(+d.i, 1); render(); },
  exDel:d => { delete UI.hoursDraft.exceptions[d.k]; render(); },
  exAdd:() => { const k = document.getElementById('ex-date').value, lb = document.getElementById('ex-label').value.trim() || 'Exceptional hours', cl = document.getElementById('ex-closed').checked, f = +document.getElementById('ex-from').value, t = +document.getElementById('ex-to').value;
    if (!k || k < dkey(S.now)) return toast('Pick today or a future date.'); if (!cl && t <= f) return toast('Closing time must be after opening time.');
    UI.hoursDraft.exceptions[k] = {label:lb, periods: cl ? [] : [[f, t]]}; render(); toast('Exception added. Press Update Working Hours to save.'); },
  hoursReset:() => { UI.hoursDraft = null; render(); }, hoursSave:() => hoursSaveFlow(),

  buyCredits:() => { meD().credits += 5; commit(); toast('5 listing credits added.'); },
  caseOpen:d => caseFlow(d.id), relOpen:d => relFlow(d.party, d.id), manualAction:() => manualActionFlow(),
  lift:d => { const p = d.party === 'customer' ? C(d.id) : D(d.id); p.restrictedUntil = null; notify(d.party === 'customer' ? keyC(d.id) : keyD(d.id), {kind:'good', title:'Test Drive Restriction Lifted', body:'You can use test drive requests again.'}); commit(); toast('Restriction lifted.'); },
  holAdd:() => { const k = document.getElementById('hol-date').value, n = document.getElementById('hol-name').value.trim(); if (!k || !n) return toast('Enter a date and a name.'); S.holidays.push({id:uid('h'), date:k, name:n, note:document.getElementById('hol-note').value.trim()}); commit(); toast('Holiday added to the calendar.'); },
  holDel:d => { S.holidays = S.holidays.filter(h => h.id !== d.id); commit(); },

  outbox:() => outboxFlow(), guide:() => guideFlow(),
  reset:() => confirmModal({title:'Reset the demo?', text:'All requests, notifications and settings go back to the starting data, and the clock returns to Monday 19 October 2026, 10:15 AM.', ok:'Reset Demo', danger:true, onOk(){ closeAllModals(); seed(); UI = {...UI, hoursDraft:null, dateFilter:null, calDate:null, calMonth:null, tab:{}, past:'all'}; commit(); toast('Demo reset.'); }}),
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (!fn) return;
  if (t.tagName === 'A' || t.tagName === 'BUTTON' || t.tagName === 'TR' || t.classList.contains('ev')) e.preventDefault();
  if (t.hasAttribute('data-close')){ const ov = t.closest('.ov'); if (ov) ov.remove(); }
  fn(t.dataset, t, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'demo-role'){ const [role, id] = t.value.split(':'); switchSession(role, id); return; }
  if (t.id === 'sort-sel'){ UI.sort = t.value; render(); return; }
  if (t.id === 'master-sw'){ masterFlow(t.checked); return; }
  const ch = t.dataset && t.dataset.ch; if (!ch) return;
  if (ch === 'lsw') return listingSwitchFlow(t.dataset.id, t.checked);
  if (ch === 'dayOpen'){ UI.hoursDraft.weekly[t.dataset.w] = t.checked ? [[540, 1260]] : []; render(); }
  if (ch === 'per'){ UI.hoursDraft.weekly[t.dataset.w][+t.dataset.i][+t.dataset.e] = +t.value; render(); }
});

/* ============ Render ============ */
function render(){
  const s = ses(), p = S.view.page;
  if (s.role === 'customer' && !C(s.id)) S.session = {role:'guest', id:null};
  let body;
  const guard = (role, f) => s.role === role ? f() : carsPage();
  switch (p){
    case 'car': body = carPage(); break;
    case 'my-td': body = guard('customer', myTDPage); break;
    case 'c-account': body = guard('customer', accountPage); break;
    case 'notifs': body = (isC() || isD()) ? notifsPage() : carsPage(); break;
    case 'd-requests': body = guard('dealer', dRequestsPage); break;
    case 'd-settings': body = guard('dealer', dSettingsPage); break;
    case 'd-listings': body = guard('dealer', dListingsPage); break;
    case 'd-history': body = guard('dealer', dHistoryPage); break;
    case 'd-sub': body = guard('dealer', dSubPage); break;
    case 'a-overview': body = guard('admin', aOverview); break;
    case 'a-history': body = guard('admin', aHistory); break;
    case 'a-feedback': body = guard('admin', aFeedback); break;
    case 'a-cases': body = guard('admin', aCases); break;
    case 'a-reliability': body = guard('admin', aReliability); break;
    case 'a-warnings': body = guard('admin', aWarnings); break;
    case 'a-holidays': body = guard('admin', aHolidays); break;
    default: body = carsPage();
  }
  document.getElementById('app').innerHTML = demoBar() + header() + body + footer();
}
S = load();
if (!S){ seed(); save(); }
else tick();
render();
</script>
