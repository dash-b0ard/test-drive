<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Aweer Test Drives</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
</head><body>
<style>
/* Layout: marketplace shell — demo control strip, site header, sidebar + content dashboard, footer. Tokens mirror the existing Al Aweer UI (green primary, blue selection, white cards on cool grey). */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F3F4F6; --surface-3:#ECEEF1; --line:#E7E9ED; --line-2:#D9DCE2;
  --fg:#15171C; --muted:#6B7280; --faint:#9AA0AA;
  --green:#34B36B; --green-h:#2DA05F; --green-ink:#1E8A4C; --green-soft:#E3F5EA;
  --blue:#1F5BD8; --blue-soft:#E8EFFD;
  --amber:#D98A06; --amber-soft:#FFF2D9;
  --red:#E1484D; --red-soft:#FDECEC;
  --violet:#6D4ED8; --violet-soft:#EFEAFD;
  --ink:#121418; --ink-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(17,20,26,.04),0 4px 16px rgba(17,20,26,.05);
  --overlay:rgba(15,18,24,.45);
  --demo-bg:#0F1A2B; --demo-fg:#DCE3EE; --demo-line:#22324B; --demo-chip:#18263C;
  --promo-a:#2A0F1E; --promo-b:#8A1630;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#16191E; --surface-2:#1C2026; --surface-3:#242931; --line:#272C34; --line-2:#333944;
  --fg:#ECEEF2; --muted:#9BA2AD; --faint:#6E7581;
  --green:#3BBF76; --green-h:#46CC82; --green-ink:#5BD594; --green-soft:#143022;
  --blue:#5E8FF2; --blue-soft:#172440;
  --amber:#EEA83A; --amber-soft:#33270F;
  --red:#F06A6E; --red-soft:#3A1B1C;
  --violet:#9C85F2; --violet-soft:#251E40;
  --ink:#ECEEF2; --ink-fg:#111318;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#16191E; --surface-2:#1C2026; --surface-3:#242931; --line:#272C34; --line-2:#333944;
  --fg:#ECEEF2; --muted:#9BA2AD; --faint:#6E7581;
  --green:#3BBF76; --green-h:#46CC82; --green-ink:#5BD594; --green-soft:#143022;
  --blue:#5E8FF2; --blue-soft:#172440;
  --amber:#EEA83A; --amber-soft:#33270F;
  --red:#F06A6E; --red-soft:#3A1B1C;
  --violet:#9C85F2; --violet-soft:#251E40;
  --ink:#ECEEF2; --ink-fg:#111318;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .xs{font-size:11px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}

/* Demo strip */
.demo{background:var(--demo-bg);color:var(--demo-fg);font-size:12.5px;border-bottom:1px solid var(--demo-line)}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.demo .tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:#E8B63A;color:#1A1405;padding:2px 7px;border-radius:4px;font-weight:700}
.demo select,.demo input{background:var(--demo-chip);border:1px solid var(--demo-line);color:var(--demo-fg);border-radius:6px;padding:4px 8px;font-size:12.5px;color-scheme:dark}
.demo .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.demo .clock{font-weight:600;color:#fff}
.demo button{background:var(--demo-chip);border:1px solid var(--demo-line);color:var(--demo-fg);border-radius:6px;padding:4px 9px;font-size:12px}
.demo button:hover{background:#22344F}
.demo .sp{flex:1}
.demo .lbl{opacity:.7}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:76px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo .mark{width:36px;height:36px;border:2.5px solid var(--fg);border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;line-height:1;direction:rtl}
.logo .t1{font-weight:700;font-size:14px;direction:rtl;text-align:left}
.logo .t2{font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:24px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 14px;color:var(--fg);opacity:.85;border-right:1px solid var(--line);font-size:14px}
.nav button:last-child{border-right:0}
.nav button.on{color:var(--green-ink);opacity:1;font-weight:600}
.nav .car{font-size:9px;margin-left:5px;opacity:.6}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.uchip{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;border-radius:10px;text-align:left}
.uchip:hover{background:var(--surface-2)}
.uchip .nm{font-size:13.5px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .st{font-size:12px;color:var(--blue)} .uchip .st.no{color:var(--amber)}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.ibtn:hover{background:var(--surface-2)}
.ibtn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:10px 16px;font-weight:500;font-size:14px;line-height:1.1;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--green);color:#fff}.btn.pri:hover{background:var(--green-h)}
.btn.ink{background:var(--ink);color:var(--ink-fg)}
.btn.out{background:var(--surface);border-color:var(--line-2)}.btn.out:hover{background:var(--surface-2)}
.btn.dan{background:var(--red);color:#fff}.btn.dan:hover{filter:brightness(.95)}
.btn.dano{background:var(--surface);border-color:var(--line-2);color:var(--red)}
.btn.ghost{background:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--blue);font-weight:500}
.lnk:hover{text-decoration:underline}

/* Page */
.crumbs{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:12px;padding-block:22px 16px;flex-wrap:wrap}
.crumbs b{color:var(--fg);font-weight:500}
.layout{display:grid;grid-template-columns:316px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:48px}
.side{background:var(--surface);border-radius:16px;padding:8px 8px 14px;position:sticky;top:12px}
.pcard{background:var(--surface-2);border-radius:14px;padding:22px 18px 18px;text-align:center;margin-bottom:14px}
.pcard .nm{font-weight:600;font-size:16px;margin-top:10px}
.pcard .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.pcard .btn{margin-top:14px;width:100%;background:var(--surface-3)}
.menu{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;font-size:14.5px;color:var(--fg)}
.mi:hover{background:var(--surface-2)}
.mi .chev{margin-left:auto;opacity:.5}
.mi.on{background:var(--green);color:#fff;font-weight:600}
.mi.open{background:var(--surface-2)}
.mi .cnt{margin-left:auto;background:var(--amber-soft);color:var(--amber);border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px}
.mi.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.sub-menu{margin-left:22px;border-left:1px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:2px;margin-block:4px}
.mi.out{color:var(--red)}
.promo{margin:16px 2px 6px;border-radius:14px;padding:18px 18px 16px;color:#fff;background:radial-gradient(120% 140% at 85% 20%,var(--promo-b),var(--promo-a) 70%);position:relative;overflow:hidden}
.promo h4{font-size:17px;font-weight:700}
.promo p{font-size:12px;opacity:.85;margin:6px 0 10px}
.promo button{background:#fff;color:#7a1430;border:0;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border-radius:16px;padding:20px}
.phead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phead h2{font-size:19px;font-weight:500}
.phead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.phead .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:7px;width:32px;height:28px;display:grid;place-items:center;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--ink-fg)}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);font-size:13px;display:flex;align-items:center;gap:6px}
.sel select{border:0;background:none;font-weight:500;padding:0}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{flex:1;min-width:110px;background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;font-size:15px;color:var(--fg);opacity:.8;display:flex;gap:8px;justify-content:center;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue);opacity:1;font-weight:600}
.tabs .c{font-size:10.5px;background:var(--surface-2);border-radius:10px;padding:1px 7px;font-weight:600;color:var(--fg)}
.tabs button.on .c{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--fg)}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}

/* Calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.cal-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-h h3{font-size:22px;font-weight:500}
.cal-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.pillbtn.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.pillbtn .b{background:rgba(255,255,255,.2);border-radius:6px;padding:1px 6px;font-size:11px}
.tl{position:relative}
.tl .row{display:flex;align-items:center;height:23px;gap:10px}
.tl .row .h{width:40px;font-size:12.5px;color:var(--fg);white-space:nowrap}
.tl .row .h span{color:var(--faint);font-size:10.5px}
.tl .row .ln{flex:1;border-top:1px solid var(--line)}
.tl .row.closed .ln{border-top-style:dashed;opacity:.6}
.tl .ev{position:absolute;left:50px;right:0;height:19px;border-radius:4px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11px;border-left:2px solid;cursor:pointer;overflow:hidden;white-space:nowrap}
.tl .ev.p{background:var(--amber-soft);border-color:var(--amber)}
.tl .ev.c{background:var(--green-soft);border-color:var(--green)}
.tl .ev.x{background:var(--surface-2);border-color:var(--faint);color:var(--muted)}
.tl .ev .r{margin-left:auto;opacity:.8}
.tl .now{position:absolute;left:44px;right:0;border-top:2px solid var(--red);pointer-events:none}
.tl .now span{position:absolute;left:-44px;top:-11px;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:2px 7px;font-weight:600}
.mcal{border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.mcal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600;font-size:13px}
.mcal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mcal .dw{font-size:10.5px;color:var(--faint);padding:6px 0}
.mcal .d{height:34px;border:0;background:none;border-radius:8px;font-size:13px;position:relative;color:var(--fg)}
.mcal .d:hover{background:var(--surface-2)}
.mcal .d.o{color:var(--faint);opacity:.5}
.mcal .d.today{font-weight:700;box-shadow:inset 0 0 0 1px var(--line-2)}
.mcal .d.sel{background:var(--blue);color:#fff}
.mcal .d i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.mcal .d i b{width:4px;height:4px;border-radius:2px;background:var(--amber)}
.mcal .d i b.c{background:var(--green)}
.mcal .d.sel i b{background:#fff}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;padding:0 4px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;border-radius:2px;display:inline-block}

/* Request cards */
.rcard{background:var(--surface);border-radius:14px;display:grid;grid-template-columns:216px minmax(0,1fr) 230px;overflow:hidden;border:1px solid var(--line)}
.rcard .img{background:linear-gradient(#9CC2E8 0 58%,#B7BBC0 58%);min-height:162px;position:relative}
.rcard .img img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0}
.rcard .mid{padding:18px 20px;display:flex;flex-direction:column;gap:4px;min-width:0;border-right:1px solid var(--line)}
.rcard .ttl{font-size:16px;font-weight:500}
.meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.meta span+span{border-left:1px solid var(--line-2);padding-left:8px}
.who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.who .n{font-size:13.5px}
.who .s{font-size:11.5px;color:var(--muted)}
.rcard .rt{padding:16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.rcard .tm{font-size:19px;font-weight:500;margin-top:6px}
.rcard .dt{font-size:13px;color:var(--muted)}
.rcard .acts{display:flex;gap:6px;margin-top:10px;width:100%}
.rcard .acts .btn{flex:1;padding:9px 8px;font-size:13px}
.note{font-size:12px;border-radius:8px;padding:7px 10px;background:var(--surface-2);color:var(--fg);display:flex;gap:6px;align-items:flex-start}
.note.am{background:var(--amber-soft);color:var(--fg)} .note.am svg{color:var(--amber)}
.note.rd{background:var(--red-soft)} .note.rd svg{color:var(--red)}
.note.gr{background:var(--green-soft)} .note.gr svg{color:var(--green-ink)}
.note.bl{background:var(--blue-soft)} .note.bl svg{color:var(--blue)}
.note.vi{background:var(--violet-soft)} .note.vi svg{color:var(--violet)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.p{background:var(--amber-soft);color:var(--amber)}
.pill.c{background:var(--green-soft);color:var(--green-ink)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.g{background:var(--surface-2);color:var(--muted)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.v{background:var(--violet-soft);color:var(--violet)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gcard .img{aspect-ratio:16/10;position:relative;background:var(--surface-2);max-width:100%}
.gcard .img img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .img .pill{position:absolute;top:10px;left:10px}
.gcard .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.gcard .acts .btn{flex:1}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h4{color:var(--fg);font-size:16px;margin-bottom:6px}
.pager{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 0}

.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none;position:relative}
.av.lg{width:56px;height:56px;font-size:18px}
.av.dl{background:#fff;color:#E3262F;border:1px solid var(--line);font-size:15px;font-weight:900;font-style:italic}
.av .vb{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:7px;background:var(--blue);border:2px solid var(--surface);display:grid;place-items:center}
.av .vb svg{width:8px;height:8px;stroke:#fff;stroke-width:3;fill:none}

/* Market */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:26px 6px}
.hero h1{font-size:28px;font-weight:600}
.hero p{color:var(--muted);margin-top:4px}
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-block:16px 48px}
.ccard{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.ccard:hover{box-shadow:var(--shadow)}
.ccard .img{aspect-ratio:16/10;position:relative;width:100%;max-width:100%}
.ccard .img img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .img .pill{position:absolute;top:10px;left:10px}
.ccard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.ccard .pr{font-size:17px;font-weight:700}
.ccard .dl{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start;padding-bottom:48px}
.detail .gal{border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2);max-width:100%}
.detail .gal img{width:100%;height:100%;object-fit:cover;display:block}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.spec{background:var(--surface);border-radius:12px;padding:12px 14px}
.spec .k{font-size:11.5px;color:var(--muted)} .spec .v{font-weight:600;margin-top:2px}
.buy{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.buy .pr{font-size:26px;font-weight:700}
.dealer-box{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px}
.contact-row{display:flex;gap:8px}
.contact-row .btn{flex:1}

function logR(r, text, at){ r.log.push({at: at || S.now, text}); }
const T = { // Part 18.3 reusable templates
  A:(r, reason, at) => notify(keyC(r.cid), {at, kind:'bad', title:'Test Drive Unavailable', body:`Your test drive request for ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)} could not be accommodated.`, reason, cta:{label:'View Test Drive Requests', act:'openReq', id:r.id}}),
  B:(r, reason, at) => notify(keyC(r.cid), {at, kind:'bad', title:'Test Drive Cancelled', body:`Your confirmed test drive for ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)} has been cancelled.`, reason, cta:{label:'View Test Drive Requests', act:'openReq', id:r.id}}),
  C:(r, at) => notify(keyC(r.cid), {at, kind:'bad', title:'Test Drive Request Expired', body:`Your test drive request for ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)} expired because the dealership did not respond in time.`, cta:{label:'View Test Drive Requests', act:'openReq', id:r.id}}),
  Dc:(r, at) => notify(keyC(r.cid), {at, kind:'good', title:'Test Drive Confirmed', body:`Your test drive for ${carName(L(r.lid))} has been confirmed for ${rDate(r)} at ${rTime(r)}.`, cta:{label:'View Appointment', act:'openReq', id:r.id}}),
  E:(r) => notify(keyC(r.cid), {kind:'info', title:'Test Drive Request Updated', body:`Your requested appointment for ${carName(L(r.lid))} has been changed to ${rDate(r)} at ${rTime(r)}. The dealership has been notified.`, cta:{label:'View Request', act:'openReq', id:r.id}}),
  DE:(r) => notify(keyD(r.did), {kind:'warn', title:'Test Drive Time Updated', body:`${C(r.cid).name} has changed their requested appointment for ${carName(L(r.lid))} to ${rDate(r)} at ${rTime(r)}. Please review the updated request.`, cta:{label:'Review Request', act:'openReq', id:r.id}}),
};

/* ---------- Request lifecycle ---------- */
function submitRequest(cid, lid, ts){
  const l = L(lid), g = customerGate(cid, lid);
  if (g) return {err:g.gate, ...g};
  if (!listingTD(l).ok) return {err:'unavailable'};
  const key = dkey(ts);
  if (!horizonKeys().includes(key)) return {err:'slot_gone'};
  const slot = slotsFor(l, key).find(x => x.ts === ts);
  if (!slot) return {err:'slot_gone'};
  if (slot.taken) return {err:'race'}; // Part 28.6
  const ov = overlapFor(cid, ts);
  if (ov) return {err:'conflict', req:ov}; // Part 8.6
  const dealer = D(l.did), deadline = responseDeadline(dealer, S.now);
  const r = {id:uid('r'), cid, lid, did:l.did, slot:ts, createdAt:S.now, updatedAt:S.now, deadline, status:'pending', rescheduled:false, log:[]};
  logR(r, `Request submitted for ${fmtDayLong(ts)} at ${fmtTime(ts)}. Dealer response due ${fmtRel(deadline)}.`);
  S.requests.push(r);
  notify(keyC(cid), {kind:'info', title:'Request Submitted', body:`Your test drive request for ${carName(l)} on ${rDate(r)} at ${rTime(r)} has been sent to ${dealer.name}. The dealership has until ${fmtRel(deadline)} to respond.`, cta:{label:'View My Test Drives', act:'openReq', id:r.id}});
  notify(keyD(dealer.id), {kind:'warn', title:'New Test Drive Request', body:`${C(cid).name} requested a test drive of ${carName(l)} on ${rDate(r)} at ${rTime(r)}. Please respond by ${fmtRel(deadline)}.`, cta:{label:'Review Request', act:'openReq', id:r.id}});
  return {ok:true, r};
}
function rescheduleRequest(rid, ts){ // Part 10
  const r = R(rid);
  if (r.status !== 'pending' || r.rescheduled) return {err:'not_allowed'};
  const c = C(r.cid);
  if (!c.verified) return {err:'verify'};
  if (c.restrictedUntil && c.restrictedUntil > S.now) return {err:'restricted', until:c.restrictedUntil};
  const l = L(r.lid);
  if (!listingTD(l).ok) return {err:'unavailable'};
  const key = dkey(ts);
  if (!horizonKeys().includes(key) || ts === r.slot) return {err:'slot_gone'};
  const slot = slotsFor(l, key, S.now, r.id).find(x => x.ts === ts);
  if (!slot) return {err:'slot_gone'};
  if (slot.taken) return {err:'race'};
  const ov = overlapFor(r.cid, ts, r.id);
  if (ov) return {err:'conflict', req:ov};
  const dl = responseDeadline(D(r.did), S.now);
  // atomic swap: old hold released and new hold reserved in the same step (no unprotected gap)
  r.prevSlot = r.slot; r.prevDeadline = r.deadline; r.slot = ts; r.deadline = dl; r.rescheduled = true; r.rescheduledAt = S.now; r.updatedAt = S.now;
  logR(r, `Customer changed the time from ${fmtDT(r.prevSlot)} to ${fmtDT(ts)}. New response deadline ${fmtRel(dl)}.`);
  T.E(r); T.DE(r);
  return {ok:true, r};
}
function dealerConfirm(rid){ // Part 11.2
  const r = R(rid);
  if (r.status !== 'pending') return {err:'state'};
  if (S.now >= r.deadline) { tick(); return {err:'expired'}; }
  if (!D(r.did).tdEnabled) return {err:'disabled'};
  r.status = 'confirmed'; r.confirmedAt = S.now; r.updatedAt = S.now;
  logR(r, 'Dealership confirmed the appointment.');
  T.Dc(r);
  notify(keyD(r.did), {kind:'good', email:false, title:'Appointment Confirmed', body:`You confirmed ${C(r.cid).name}'s test drive of ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)}.`, cta:{label:'View Appointment', act:'openReq', id:r.id}});
  return {ok:true};
}
function dealerReject(rid, reason, text, listingAction){ // Part 11.3–11.4
  const r = R(rid);
  if (r.status !== 'pending') return {err:'state'};
  if (S.now >= r.deadline) { tick(); return {err:'expired'}; }
  const full = reason === 'Other Reason' ? `Other: ${text}` : reason;
  r.status = 'rejected'; r.reject = {reason, text, at:S.now}; r.updatedAt = S.now;
  logR(r, `Dealership declined the request. Reason: ${full}.`);
  T.A(r, full);
  notify(keyD(r.did), {kind:'info', email:false, title:'Request Declined', body:`You declined ${C(r.cid).name}'s request for ${carName(L(r.lid))}.`, reason:full});
  if (listingAction) setListingStatus(r.lid, listingAction);
  return {ok:true};
}
function customerCancel(rid, reason, text){ // Part 12.1–12.2, 12.5
  const r = R(rid);
  if (!ACTIVE(r) || S.now >= r.slot) return {err:'state'};
  const full = reason === 'Other Reason' ? `Other: ${text}` : reason;
  const wasConfirmed = r.status === 'confirmed';
  const late = wasConfirmed && r.slot - S.now <= 2 * HOUR;
  r.status = 'cancelled'; r.cancel = {by:'customer', reason, text, at:S.now, late, minutesBefore:Math.round((r.slot - S.now)/MIN), wasConfirmed}; r.updatedAt = S.now;
  logR(r, `Customer cancelled the ${wasConfirmed ? 'appointment' : 'request'}${late ? ' (less than 2 hours before start)' : ''}. Reason: ${full}.`);
  notify(keyC(r.cid), {kind:'info', email:false, title:'Cancellation Recorded', body:`Your test drive for ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)} has been cancelled. The dealership has been notified.`});
  notify(keyD(r.did), {kind:'bad', title:'Test Drive Cancelled by Customer', body:`${C(r.cid).name} cancelled their ${wasConfirmed ? 'confirmed appointment' : 'request'} for ${carName(L(r.lid))} on ${rDate(r)} at ${rTime(r)}.`, reason:full, cta:{label:'View Details', act:'openReq', id:r.id}});
  return {ok:true};
}
function dealerCancel(rid, reason, text, ack){ // Part 12.3–12.4, 12.6
  const r = R(rid);
  if (r.status !== 'confirmed' || S.now >= r.slot) return {err:'state'};
  const late = r.slot - S.now <= 2 * HOUR;
  if (late && !ack) return {err:'ack'};
  const full = reason === 'Other Reason' ? `Other: ${text}` : reason;
  r.status = 'cancelled'; r.cancel = {by:'dealer', reason, text, at:S.now, late, ack:!!ack, minutesBefore:Math.round((r.slot - S.now)/MIN), wasConfirmed:true}; r.updatedAt = S.now;
  logR(r, `Dealership cancelled the confirmed appointment${late ? ' within 2 hours of start (customer contact attempt acknowledged)' : ''}. Reason: ${full}.`);
  T.B(r, full);
  notify(keyD(r.did), {kind:'info', email:false, title:'Cancellation Recorded', body:`You cancelled the test drive with ${C(r.cid).name} for ${carName(L(r.lid))}.`, reason:full});
  if (late) addIncident('dealer', r.did, r.id, 'Last-minute cancellation of a confirmed appointment', true);
  if (reason === 'Vehicle Sold') setListingStatus(r.lid, 'sold');
  if (reason === 'Vehicle Reserved') setListingStatus(r.lid, 'reserved');
  return {ok:true};
}
function systemClose(r, reason, at){ r.status = 'closed'; r.close = {reason, at:at || S.now}; r.updatedAt = at || S.now; logR(r, `Request closed by the system. Reason: ${reason}.`, at); T.A(r, reason, at); }
function systemCancelConfirmed(r, reason, at){ r.status = 'cancelled'; r.cancel = {by:'dealer', reason, at:at || S.now, system:true, wasConfirmed:true}; r.updatedAt = at || S.now; logR(r, `Confirmed appointment cancelled. Reason: ${reason}.`, at); T.B(r, reason, at); }

/* ---------- Switches (Part 2) ---------- */
function affectedBy(pred){ const p = S.requests.filter(r => r.status === 'pending' && pred(r)); const c = S.requests.filter(r => r.status === 'confirmed' && r.slot > S.now && pred(r)); return {pending:p, confirmed:c}; }
function setMaster(did, on, cancelConfirmed, reasonText){
  const d = D(did);
  if (on){ d.tdEnabled = true; notify(keyD(did), {kind:'good', email:false, title:'Test Drive Requests Enabled', body:'Customers can request test drives again on listings where the car switch is ON. Closed requests do not reopen.'}); return {ok:true}; }
  const a = affectedBy(r => r.did === did);
  d.tdEnabled = false;
  a.pending.forEach(r => systemClose(r, 'The dealership has paused test drive requests'));
  if (cancelConfirmed) a.confirmed.forEach(r => systemCancelConfirmed(r, reasonText));
  notify(keyD(did), {kind:'info', title:'Test Drive Requests Disabled', body:`Test drives are now off for your dealership. ${a.pending.length} pending request(s) were closed and ${a.confirmed.length} confirmed appointment(s) were ${cancelConfirmed ? 'cancelled' : 'kept'}. Your per-car settings are saved.`});
  return {ok:true, a};
}
function setListingSwitch(lid, on, cancelConfirmed, reasonText){
  const l = L(lid);
  if (on){ l.tdEnabled = true; return {ok:true}; }
  const a = affectedBy(r => r.lid === lid);
  l.tdEnabled = false;
  a.pending.forEach(r => systemClose(r, 'Test drives are no longer available for this car'));
  if (cancelConfirmed) a.confirmed.forEach(r => systemCancelConfirmed(r, reasonText));
  notify(keyD(l.did), {kind:'info', email:false, title:'Test Drives Disabled for a Car', body:`${carName(l)}: ${a.pending.length} pending closed, ${a.confirmed.length} confirmed ${cancelConfirmed ? 'cancelled' : 'kept'}.`});
  return {ok:true, a};
}

/* ---------- Listing lifecycle (Parts 13, 14) ---------- */
function setListingStatus(lid, status, extra){
  const l = L(lid), prev = l.status;
  if (status === 'available'){ l.status = 'available'; return {ok:true}; }
  const label = status === 'sold' ? 'The car has been sold' : status === 'reserved' ? 'The car is now reserved' : 'The listing was removed';
  const a = affectedBy(r => r.lid === lid);
  l.status = status;
  if (status === 'deleted'){ l.deletedAt = S.now; l.deletedSold = extra && extra.wasSold; }
  a.pending.forEach(r => systemClose(r, label));
  a.confirmed.forEach(r => systemCancelConfirmed(r, label));
  if (prev !== status) notify(keyD(l.did), {kind:'info', email:false, title:`Listing ${status === 'deleted' ? 'Deleted' : 'Marked ' + status[0].toUpperCase() + status.slice(1)}`, body:`${carName(l)}: ${a.pending.length} pending request(s) closed and ${a.confirmed.length} confirmed appointment(s) cancelled. Customers were notified.`});
  return {ok:true, a};
}
function canRelist(l){ const d = D(l.did); if (S.now < l.expiresAt) return {ok:false, msg:'Re-listing is available only after the listing expires.'}; if (l.status === 'deleted' || l.status === 'sold') return {ok:false, msg:'Sold or deleted cars cannot be re-listed.'}; if (d.subscriptionEnd <= S.now) return {ok:false, msg:'An active subscription is required to re-list.'}; if (d.credits < 1) return {ok:false, msg:'You need a listing credit to re-list.'}; return {ok:true}; }
function relist(lid){ const l = L(lid), c = canRelist(l); if (!c.ok) return c; const d = D(l.did); d.credits--; l.publishedAt = S.now; l.expiresAt = S.now + 30 * DAY; l.expProcessed = false; if (l.status !== 'available') l.status = 'available'; notify(keyD(d.id), {kind:'good', email:false, title:'Listing Re-published', body:`${carName(l)} is live again until ${fmtDTY(l.expiresAt)}. Earlier closed requests stay closed.`}); return {ok:true}; }
function canPublish(d){ if (d.subscriptionEnd <= S.now) return {ok:false, msg:'Your subscription has ended. Renew it to publish new listings.'}; if (d.credits < 1) return {ok:false, msg:'You need a listing credit to publish.'}; return {ok:true}; }

/* ---------- Working-hours changes (Part 3.5, 6.7) ---------- */
function hoursImpact(did, newHours){
  const d = D(did);
  const pending = S.requests.filter(r => r.did === did && r.status === 'pending' && (!slotFits(d, r.slot, newHours) || !deadlineFits(d, r.deadline, newHours)));
  const confirmed = S.requests.filter(r => r.did === did && r.status === 'confirmed' && r.slot > S.now && !slotFits(d, r.slot, newHours));
  return {pending, confirmed};
}
function applyHours(did, newHours, cancelConfirmed, reasonText){
  const d = D(did), a = hoursImpact(did, newHours);
  d.hours = newHours;
  a.pending.forEach(r => systemClose(r, 'The dealership changed its working hours and can no longer accommodate this time'));
  if (cancelConfirmed) a.confirmed.forEach(r => systemCancelConfirmed(r, reasonText));
  notify(keyD(did), {kind:'info', email:false, title:'Working Hours Updated', body:`New hours saved. ${a.pending.length} pending request(s) closed; ${a.confirmed.length} affected confirmed appointment(s) ${cancelConfirmed ? 'cancelled' : 'kept'}.`});
  return a;
}

/* ---------- Time-driven processing (Parts 6.6, 13.3, 19, 20) ---------- */
function tick(){
  const now = S.now;
  for (const l of S.listings){
    if (l.status !== 'deleted' && now >= l.expiresAt && !l.expProcessed){
      l.expProcessed = true;
      S.requests.filter(r => r.lid === l.id && r.status === 'pending').forEach(r => systemClose(r, 'The listing has expired', l.expiresAt));
      if (l.seller === 'dealer') notify(keyD(l.did), {at:l.expiresAt, kind:'info', email:false, title:'Listing Expired', body:`${carName(l)} reached the end of its 30-day listing period. You can re-list it with an active subscription and a listing credit.`, cta:{label:'Go to My Listings', act:'go', page:'d-listings'}});
    }
  }
  for (const r of S.requests){
    if (r.status === 'pending' && now >= r.deadline){
      r.status = 'expired'; r.expiredAt = r.deadline; r.updatedAt = r.deadline;
      logR(r, 'Request expired: the dealership did not respond by the deadline. Slot released.', r.deadline);
      T.C(r, r.deadline);
      notify(keyD(r.did), {at:r.deadline, kind:'bad', title:'Missed Test Drive Request', body:`You didn't respond to ${C(r.cid).name}'s request for ${carName(L(r.lid))} (${rDate(r)} at ${rTime(r)}) before ${fmtTime(r.deadline)}. The request expired and the customer was notified.`, cta:{label:'View Details', act:'openReq', id:r.id}});
    }
  }
  for (const r of S.requests){
    if (r.status !== 'confirmed') continue;
    for (const [flag, hrs] of [['rem24', 24], ['rem2', 2]]){
      if (r[flag]) continue;
      const t = r.slot - hrs * HOUR;
      if (now >= t){ r[flag] = true; if (r.confirmedAt < t && now < r.slot) sendReminder(r, t); else r[flag + 'Skipped'] = true; }
    }
    if (now >= r.slot + 2 * HOUR){ // Part 20.2 — one hour after the 60-minute allocation ends
      const at = r.slot + 2 * HOUR;
      r.status = 'outcome_unknown'; r.fbAt = at; r.updatedAt = at;
      logR(r, 'Appointment window ended. Feedback requested from both parties.', at);
      const l = L(r.lid), d = D(r.did), c = C(r.cid);
      notify(keyC(r.cid), {at, kind:'fb', title:'How Did Your Test Drive Go?', body:`Your appointment for ${carName(l)} at ${d.name} has ended. Let us know how it went.`, cta:{label:'Share Feedback', act:'survey', id:r.id},
        email:{subject:'How Did Your Test Drive Go?', body:`Your test drive appointment for ${carName(l)} at ${d.name} was scheduled for ${rDate(r)} at ${rTime(r)}. We'd like to know whether you attended and how your appointment went. Your feedback helps us improve the experience for customers and dealerships.`, cta:{label:'Share Feedback', act:'survey', id:r.id}}});
      notify(keyD(r.did), {at, kind:'fb', title:'Test Drive Appointment Follow-Up', body:`Your appointment with ${c.name} for ${carName(l)} has ended. Please confirm the appointment outcome.`, cta:{label:'Update Appointment', act:'survey', id:r.id},
        email:{subject:'Test Drive Appointment Follow-Up', body:`Your test drive appointment with ${c.name} for ${carName(l)} was scheduled for ${rDate(r)} at ${rTime(r)}. Please confirm whether the customer attended and whether the test drive took place.`, cta:{label:'Update Appointment', act:'survey', id:r.id}}});
    }
  }
  for (const p of [...S.customers, ...S.dealers]) if (p.restrictedUntil && p.restrictedUntil <= now){ p.restrictedUntil = null; }
}
function sendReminder(r, at){
  const l = L(r.lid), d = D(r.did), c = C(r.cid);
  notify(keyC(r.cid), {at, kind:'rem', title:'Upcoming Test Drive', body:`Your test drive for ${carName(l)} at ${d.name} is scheduled for ${rDate(r)} at ${rTime(r)}.`, cta:{label:'View Appointment', act:'openReq', id:r.id}});
  notify(keyD(r.did), {at, kind:'rem', title:'Upcoming Test Drive', body:`You have a confirmed test drive for ${carName(l)} with ${c.name} on ${rDate(r)} at ${rTime(r)}.`, cta:{label:'View Appointment', act:'openReq', id:r.id}});
  logR(r, `Reminder sent to both parties (${Math.round((r.slot - at)/HOUR)}h before).`, at);
}

/* ---------- Feedback & outcomes (Parts 20–24) ---------- */
function canSurvey(r, party){ return ['outcome_unknown','completed','not_completed'].includes(r.status) && r.fbAt && !(party === 'customer' ? r.cRep : r.dRep); }
function submitSurvey(rid, party, rep){
  const r = R(rid);
  if (!r.fbAt) return {err:'na'};
  if (party === 'customer'){ if (r.cRep) return {err:'dup'}; r.cRep = {...rep, at:S.now}; }
  else { if (r.dRep) return {err:'dup'}; r.dRep = {...rep, at:S.now}; }
  logR(r, `${party === 'customer' ? 'Customer' : 'Dealership'} submitted appointment feedback.`);
  notify(party === 'customer' ? keyC(r.cid) : keyD(r.did), {kind:'good', title:'Feedback Submitted', body:'Thank you. Your feedback has been recorded.', cta:{label:'View Appointment', act:'openReq', id:r.id}});
  applyOutcome(r);
  return {ok:true};
}
function deriveOutcome(r){
  const c = r.cRep, d = r.dRep;
  const cAtt = c ? c.visited === 'yes' : null, dAtt = d ? d.attended === 'yes' : null;
  const cDrive = c ? (c.visited === 'yes' && c.carAvailable === 'yes' && c.completed === 'yes') : null;
  const dDrive = d ? (d.attended === 'yes' && d.tookPlace === 'yes') : null;
  const att = v => v === null ? 'Unknown' : v ? 'Attended' : 'Did Not Attend';
  const drv = v => v === null ? 'Unknown' : v ? 'Completed' : 'Not Completed';
  if (!c && !d) return {attendance:'Unknown', drive:'Unknown', interp:'Outcome Unknown', status:'outcome_unknown', flag:null};
  if (!c || !d){
    const a = c ? cAtt : dAtt, dr = c ? cDrive : dDrive;
    return {attendance:att(a), drive:drv(dr), interp:`Unverified report (${c ? 'customer' : 'dealership'} only)`, status: dr ? 'completed' : 'not_completed', flag:'unverified'};
  }
  let conflict = null;
  if (cAtt !== dAtt) conflict = cAtt ? 'Customer says they attended; dealership reports a no-show.' : 'Customer says they did not attend; dealership reports attendance.';
  else if (cAtt && c.carAvailable === 'no' && !(d.tookPlace === 'no' && d.reason === 'Vehicle unavailable')) conflict = 'Customer reports the car was unavailable; dealership disputes this.';
  else if (cAtt && cDrive !== dDrive) conflict = 'Reports disagree on whether the test drive took place.';
  else if (!cAtt && c.whyNot === 'The dealership cancelled or asked me not to come' && d.notified === 'no') conflict = 'Customer says the dealership asked them not to come; dealership says the customer did not notify them.';
  if (conflict) return {attendance:'Disputed', drive:'Disputed', interp:'Conflicting reports', status:'outcome_unknown', flag:'conflict', conflict};
  let interp = cAtt ? 'Attendance confirmed' : 'Non-attendance confirmed';
  if (cAtt && c.carAvailable === 'no') interp = 'Availability issue confirmed';
  return {attendance:att(cAtt), drive:drv(cDrive), interp, status: cDrive ? 'completed' : 'not_completed', flag:null};
}
function applyOutcome(r){
  const o = deriveOutcome(r);
  r.outcome = o; r.status = r.adminFinal || o.status;
  // remove previous automatic, unverified incidents for this request, then re-derive
  S.incidents = S.incidents.filter(i => !(i.rid === r.id && i.auto && !i.substantiated));
  const c = r.cRep, d = r.dRep;
  if (o.flag === 'conflict'){
    if (!S.cases.some(k => k.rid === r.id && k.type === 'conflict')){
      S.cases.push({id:uid('k'), type:'conflict', rid:r.id, at:S.now, status:'open', title:'Conflicting Reports', text:o.conflict});
      logR(r, 'Flagged for administrative review: conflicting reports.');
    }
    return;
  }
  if (o.flag === 'unverified'){
    if (d && !c && d.attended === 'no' && d.notified === 'no'){
      addIncident('customer', r.cid, r.id, 'Dealership-reported no-show (unverified)', false, true);
      if (!r.neutralSent){ r.neutralSent = true;
        notify(keyC(r.cid), {kind:'warn', title:'Missed Test Drive Appointment', body:'The dealership reported that you did not attend your scheduled appointment. If this is not correct, you can dispute the report.', cta:{label:'Dispute Report', act:'dispute', id:r.id}}); }
    }
    if (c && !d && ((c.visited === 'yes' && c.carAvailable === 'no') || c.whyNot === 'The dealership cancelled or asked me not to come' || c.whyNoDrive === 'Dealership could not accommodate the test drive'))
      addIncident('dealer', r.did, r.id, 'Customer-reported appointment issue (unverified)', false, true);
    return;
  }
  if (o.interp === 'Non-attendance confirmed' && d.notified === 'no' && c.whyNot !== 'I cancelled beforehand') addIncident('customer', r.cid, r.id, 'No-show at a confirmed appointment', true, true);
  if (o.interp === 'Availability issue confirmed') addIncident('dealer', r.did, r.id, 'Advertised car unavailable at a confirmed appointment', true, true);
  if (o.interp === 'Attendance confirmed' && !o.status.startsWith('completed') && c.whyNoDrive === 'Dealership could not accommodate the test drive' && d.reason === 'Dealership unable to accommodate')
    addIncident('dealer', r.did, r.id, 'Confirmed appointment not honoured', true, true);
}

/* ---------- Reliability (Parts 25–27) ---------- */
function addIncident(party, pid, rid, type, substantiated, auto, noEscalate){
  if (substantiated && S.incidents.some(i => i.rid === rid && i.party === party && i.type === type && i.substantiated)) return;
  S.incidents.push({id:uid('i'), party, pid, rid, type, substantiated, auto:!!auto, at:S.now});
  if (substantiated && !noEscalate) escalate(party, pid, rid);
}
function substCount(party, pid){ return S.incidents.filter(i => i.party === party && i.pid === pid && i.substantiated && S.now - i.at <= 90 * DAY).length; }
function escalate(party, pid, rid){
  const n = substCount(party, pid);

function modal(o){

  const api = {el:ov, md:ov.querySelector('.md'), body:ov.querySelector('.mb'), foot:ov.querySelector('.mf'), closed:false,
    close(){ if (api.closed) return; api.closed = true; ov.remove(); o.onClose && o.onClose(); },
    set(body, foot, head){ if (body != null) api.body.innerHTML = body; if (foot != null){ api.foot.innerHTML = foot; api.foot.hidden = !foot; } if (head){ const h = ov.querySelector('.mh>div'); h.innerHTML = `${head.title ? `<h3>${head.title}</h3>` : ''}${head.sub ? `<div class="sub">${head.sub}</div>` : ''}`; h.className = head.center ? 'center' : ''; } }};
  api.set(o.body || '', o.foot || '');
  ov.addEventListener('click', e => { if (e.target === ov && !o.sticky) api.close(); if (e.target.closest('[data-close]')) api.close(); });
  document.getElementById('modals').appendChild(ov);
  o.mount && o.mount(api);

}

/* ============ Calendar (Part 17.6) ============ */
function calendarPanel(items, role){
  const today = dkey(S.now), sel = UI.calDate || today, month = UI.calMonth || sel.slice(0, 7);
  const selTs = kts(sel), todayCount = items.filter(r => dkey(r.slot) === today && ['pending','confirmed'].includes(r.status)).length;
  const head = `<div class="cal-h"><div><h3>${dp(selTs).d} ${MONS[dp(selTs).m]} ${dp(selTs).y}</h3><div class="small muted">${DOWS[dp(selTs).dow]}${holidayOn(sel) ? ` · ${esc(holidayOn(sel).name)}` : ''}</div></div>
    <div class="tools"><button class="pillbtn ink" data-a="calToday">Today <span class="b">${todayCount}</span></button>
    <button class="pillbtn" data-a="calMonth" data-d="-1" aria-label="Previous month">${I('cl','sm')}</button><span class="pillbtn" style="min-width:96px">${MONS[+month.slice(5) - 1]}</span><button class="pillbtn" data-a="calMonth" data-d="1" aria-label="Next month">${I('cr','sm')}</button>
    <button class="pillbtn" data-a="calToggle" aria-label="Collapse calendar">${I(UI.calOpen ? 'cu' : 'cd','sm')}</button></div></div>`;
  if (!UI.calOpen) return `<div class="panel">${head}</div>`;
  // Timeline range
  let sH = 9, eH = 22;
  if (role === 'dealer'){ const iv = intervalsOn(meD(), sel); if (iv.length){ sH = Math.floor(Math.min(...iv.map(x => x[0])) / 60); eH = Math.ceil(Math.max(...iv.map(x => x[1])) / 60); } }
  const dayItems = items.filter(r => dkey(r.slot) === sel);
  dayItems.forEach(r => { const h = dp(r.slot).h; sH = Math.min(sH, h); eH = Math.max(eH, h + 1); });
  const rows = [], RH = 23;
  const openIv = role === 'dealer' ? intervalsOn(meD(), sel) : null;
  for (let h = sH; h <= eH; h++){ const closed = openIv && !openIv.some(([a, b]) => h * 60 >= a && h * 60 < b); const hh = h % 12 || 12; rows.push(`<div class="row ${closed ? 'closed' : ''}"><div class="h num">${h === 12 ? '12' : hh} <span>${h < 12 || h === 24 ? 'AM' : 'PM'}</span></div><div class="ln"></div></div>`); }
  const groups = {};
  dayItems.forEach(r => { (groups[r.slot] = groups[r.slot] || []).push(r); });
  const evs = Object.values(groups).flatMap(g => g.map((r, i) => {
    const top = (dp(r.slot).h - sH) * RH + 2 + RH / 2, cls = r.status === 'pending' ? 'p' : r.status === 'confirmed' ? 'c' : 'x';
    const who = role === 'dealer' ? C(r.cid).name.split(' ')[0] : D(r.did).name;
    const lbl = role === 'dealer' ? `${fmtTime(r.slot)} – ${fmtTime(r.slot + HOUR)}` : fmtTime(r.slot);
    return `<div class="ev ${cls}" data-a="openReq" data-id="${r.id}" style="top:${top}px;left:calc(50px + ${i} * (100% - 50px) / ${g.length});right:auto;width:calc((100% - 50px) / ${g.length} - 4px)" title="${esc(carName(L(r.lid)))}"><b>${lbl}</b><span>${esc(L(r.lid).model)} · ${esc(who)}</span><span class="r">${(role === 'dealer' ? D_LABEL : C_LABEL)[r.status]}</span></div>`;
  })).join('');
  let nowLine = '';
  if (sel === today){ const m = minsOf(S.now); if (m >= sH * 60 && m <= eH * 60 + 59) nowLine = `<div class="now" style="top:${(m - sH * 60) / 60 * RH + RH / 2}px"><span class="num">${fmtTime(S.now).replace(' AM','').replace(' PM','')}</span></div>`; }
  // Month grid (Monday first)
  const [my, mm] = month.split('-').map(Number), first = `${month}-01`, fdow = (kdow(first) + 6) % 7;
  const daysIn = new Date(Date.UTC(my, mm, 0)).getUTCDate();
  const cells = [], total = Math.ceil((fdow + daysIn) / 7) * 7;
  for (let i = 0; i < total; i++){
    const k = addDays(first, i - fdow), inM = k.slice(0, 7) === month;
    const its = items.filter(r => dkey(r.slot) === k);
    const hasP = its.some(r => r.status === 'pending'), hasC = its.some(r => r.status === 'confirmed');
    cells.push(`<button class="d num ${inM ? '' : 'o'} ${k === today ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-a="calDay" data-k="${k}" title="${holidayOn(k) ? esc(holidayOn(k).name) : ''}">${+k.slice(8)}${hasP || hasC ? `<i>${hasP ? '<b></b>' : ''}${hasC ? '<b class="c"></b>' : ''}</i>` : ''}</button>`);
  }
  return `<div class="panel">${head}<div class="cal"><div class="tl" style="min-height:${(eH - sH + 1) * RH}px">${rows.join('')}${evs}${nowLine}</div>
    <div><div class="mcal"><div class="g">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<div class="dw">${x}</div>`).join('')}${cells.join('')}</div></div>
    <div class="legend"><span><b style="background:var(--amber)"></b>Pending</span><span><b style="background:var(--green)"></b>Confirmed</span>${role === 'dealer' ? '<span><b style="border:1px dashed var(--line-2)"></b>Closed hours</span>' : ''}</div></div></div></div>`;
}

    else acts = `<button class="btn dano" data-a="${role === 'dealer' ? 'dCancel' : 'cCancel'}" data-id="${r.id}">Cancel</button>`;

    <div class="acts">${acts}</div><button class="btn wide sm" style="margin-top:6px" data-a="openReq" data-id="${r.id}">View Details ${I('cr','sm')}</button>`;
  if (grid) return `<div class="gcard"><div class="img"><img src="${carImg(l.color)}" alt=""></div><div class="bd"><div style="font-weight:500">${esc(l.make)} · ${esc(l.model)} · ${esc(l.trim)}</div><div class="meta num"><span>${l.km.toLocaleString('en-US')} KM</span><span>${l.year}</span></div><div class="who" style="padding-top:6px">${who}</div><div style="border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center">${right}</div></div></div>`;
  return `<div class="rcard"><div class="img"><img src="${carImg(l.color)}" alt=""></div><div class="mid"><div class="ttl">${esc(l.make)} · ${esc(l.model)} · ${esc(l.trim)}</div><div class="meta num"><span>${l.km.toLocaleString('en-US')} KM</span><span>${l.year}</span><span>${l.spec}</span></div><div class="who">${who}</div></div><div class="rt">${right}</div></div>`;

function partyRel(party, p){
  const inc = S.incidents.filter(i => i.party === party && i.pid === p.id);
  const reqs = S.requests.filter(r => party === 'customer' ? r.cid === p.id : r.did === p.id);
  const cancels = reqs.filter(r => r.cancel && r.cancel.by === party).length, late = reqs.filter(r => r.cancel && r.cancel.by === party && r.cancel.late).length;
  return {inc, subst:substCount(party, p.id), unver:inc.filter(i => !i.substantiated && !i.dismissed).length, cancels, late, total:reqs.length, warns:S.warnings.filter(w => w.party === party && w.pid === p.id).length,
    rejRate: party === 'dealer' ? dealerStats(p.id).rejRate + '%' : '—', missed: party === 'dealer' ? reqs.filter(r => r.status === 'expired').length : '—'};
}

function runIntent(){ const f = pendingIntent; pendingIntent = null; if (f) setTimeout(f, 30); }

      m.body.querySelectorAll('input[name=doc]').forEach(i => i.onchange = () => m.body.querySelectorAll('input[name=doc]').forEach(j => j.closest('.opt').classList.toggle('on', j.checked)));

function limitModal(){ infoModal({title:'Test Drive Limit Reached', text:'You can have up to 5 active test drive requests at a time. Please complete or cancel an existing request before scheduling another.', icon:'alert', tone:'am', actions:`<button class="btn out" data-close>Close</button><button class="btn pri" data-a="go" data-p="my-td" data-close>View My Test Drives</button>`}); }

  const m = infoModal({title:'Appointment Time Conflict', text:`You already have a test drive scheduled for ${fmtDayLong(ov.slot)} at ${fmtTime(ov.slot)}. Please choose another time.`, icon:'cal', tone:'am', actions:`<button class="btn out" data-m="v">View My Test Drives</button><button class="btn pri" data-close>Choose Another Time</button>`});

function raceModal(){ return infoModal({title:'Time No Longer Available', text:'This appointment time has just been reserved. Please select another available time.', icon:'clock', tone:'am', ok:'Choose Another Time'}); }

function startTD(lid){
  if (isG()) return loginModal(() => startTD(lid));
  if (!isC()) return toast('Test drive requests can be sent from customer accounts only.');
  const l = L(lid), td = listingTD(l);
  if (!td.ok) return toast(td.msg || 'Test drives are not available for this car right now.');
  const g = customerGate(ses().id, lid);
  if (g){
    if (g.gate === 'verify') return verifyModal(() => startTD(lid));
    if (g.gate === 'restricted') return restrictedModal(g.until);
    if (g.gate === 'limit') return limitModal();
    if (g.gate === 'active_for_car') return infoModal({title:'You Already Have a Request for This Car', text:`You can have one active request per car. Your ${g.req.status === 'pending' ? 'pending request' : 'confirmed test drive'} is on ${fmtDayLong(g.req.slot)} at ${fmtTime(g.req.slot)}.`, icon:'cal', actions:`<button class="btn out" data-close>Close</button><button class="btn pri" data-a="openReq" data-id="${g.req.id}" data-close>View Request</button>`});
  }
  booking(lid);
}

    ['Document Requirement','shield','Bring Your Documents','Bring your original UAE driving licence and Emirates ID. You don\'t need to upload any documents to book. Platform verification does not guarantee driving eligibility.'],

          <div class="contact-row" style="width:100%;max-width:340px"><a class="btn out" href="tel:${d.phone.replace(/\s/g, '')}">${I('phone','sm')} Call</a><a class="btn out" href="https://wa.me/${d.wa.replace(/\D/g, '')}" target="_blank" rel="noopener">${I('wa','sm')} WhatsApp</a></div><div class="small muted num" style="user-select:all">${d.phone} · ${d.wa}</div></div>`

      const res = resched ? rescheduleRequest(rid, w.ts) : submitRequest(ses().id, lid, w.ts);
      if (res.err){
        if (res.err === 'race'){ raceModal(); w.step = 'time'; w.ts = null; }
        else if (res.err === 'conflict'){ conflictModal(res.req); w.step = 'time'; w.ts = null; }
        else if (res.err === 'limit'){ m.close(); limitModal(); return; }
        else if (res.err === 'restricted'){ m.close(); restrictedModal(res.until); return; }
        else if (res.err === 'verify'){ m.close(); verifyModal(); return; }
        else if (res.err === 'active_for_car'){ m.close(); toast('You already have an active request for this car.'); return; }
        else { toast(resched ? 'That time is no longer available. Your original time is still reserved.' : 'That time is no longer available. Please choose another.'); w.step = 'date'; w.ts = null; }
        commit(); draw(); return;
      }
      w.rid = res.r.id; w.step = 'done'; commit();
    }
    else if (k === 'view'){ m.close(); UI.tab.c = 'up'; go('my-td'); return; }
    draw();
  };
  draw();
}

/* ============ Request details ============ */
function canSee(r){ if (isA()) return true; if (isC()) return r.cid === ses().id; if (isD()) return r.did === ses().id; return false; }
function openReq(rid){
  const r = R(rid); if (!r) return;
  if (!canSee(r)){ if (isG()) return loginModal(() => openReq(rid), 'Log in to view this appointment.'); return toast('This appointment belongs to another account.'); }
  const role = isA() ? 'admin' : isC() ? 'customer' : 'dealer', l = L(r.lid), d = D(r.did), c = C(r.cid);
  const contactOk = ACTIVE(r) || ['completed','not_completed','outcome_unknown'].includes(r.status);
  let banner = '';
  if (r.status === 'pending') banner = role === 'dealer' ? `<div class="banner am">${I('clock')}<div><div class="t">Response Required</div><div>Please respond by ${fmtRel(r.deadline)}. Otherwise, this request will automatically expire, and the customer will be notified.</div></div></div>`
    : `<div class="banner am">${I('clock')}<div><div class="t">Awaiting Dealership Response</div><div>The dealership has until ${fmtRel(r.deadline)} to respond to your request. If they don't respond, your request will automatically expire.</div></div></div>`;
  if (r.status === 'pending' && r.rescheduled) banner += `<div class="banner bl">${I('refresh')}<div><div class="t">Time Updated</div><div>Changed from ${fmtDT(r.prevSlot)} to <b>${fmtDT(r.slot)}</b>.${role === 'dealer' ? ' Only the new time can be confirmed.' : ' You have used your one time change.'}</div></div></div>`;
  if (r.status === 'confirmed' && S.now < r.slot) banner = `<div class="banner bl">${I('calc')}<div><div class="t">${role === 'customer' ? 'Test Drive Confirmed' : 'Confirmed Appointment'}</div><div>${fmtDayLong(r.slot)} at ${fmtTime(r.slot)} at ${esc(d.addr)}.${role === 'customer' ? ' No reconfirmation needed. Bring your original UAE driving licence and Emirates ID.' : ''}</div></div></div>`;
  if (r.status === 'confirmed' && S.now >= r.slot) banner = `<div class="banner bl">${I('info')}<div><div class="t">Appointment in progress</div><div>Cancellation is no longer available. Feedback opens at ${fmtTime(r.slot + 2 * HOUR)}.</div></div></div>`;
  if (r.outcome && r.outcome.flag === 'conflict') banner = `<div class="banner vi">${I('flag')}<div><div class="t">Conflicting Reports</div><div>${esc(r.outcome.conflict)} Our team will review both reports. Neither party is penalised automatically.</div></div></div>`;
  const reason = r.reject ? `${r.reject.reason}${r.reject.text ? ' — ' + esc(r.reject.text) : ''}` : r.cancel ? `${r.cancel.reason}${r.cancel.text ? ' — ' + esc(r.cancel.text) : ''}` : r.close ? r.close.reason : r.status === 'expired' ? 'The dealership did not respond in time.' : '';
  const kv = [
    ['Car', `${esc(carName(l))} · ${l.year}`],
    [role === 'dealer' ? 'Customer' : 'Dealership', role === 'dealer' ? `${esc(c.name)} <span class="pill c" style="padding:1px 7px;font-size:10.5px">Verified</span>` : esc(d.name)],
    ...(role === 'admin' ? [['Customer', esc(c.name)]] : []),
    ['Date & time', `<b>${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}</b>`],
    ['Location', esc(d.addr)],
    ['Requested', fmtDTY(r.createdAt)],
    ...(r.status === 'pending' ? [['Response deadline', fmtRel(r.deadline)]] : []),
    ...(reason ? [[r.status === 'cancelled' ? `Cancelled by ${r.cancel.by === 'dealer' ? 'dealership' : 'customer'}` : r.status === 'closed' ? 'Closure reason' : 'Reason', esc(reason)]] : []),
    ...(r.cancel && r.cancel.late ? [['Timing', `${r.cancel.minutesBefore} min before start${r.cancel.ack ? ' · customer contact attempt acknowledged' : ''}`]] : []),
    ...(r.outcome ? [['Attendance', r.outcome.attendance], ['Test drive', r.outcome.drive], ['Interpretation', esc(r.outcome.interp)]] : []),
    ...(r.adminNote ? [['Admin note', esc(r.adminNote)]] : []),
  ];
  const showC = role !== 'dealer' || contactOk;
  const contact = role === 'customer' ? `<div class="contact-row"><a class="btn out sm" href="tel:${d.phone.replace(/\s/g, '')}">${I('phone','sm')} Call Dealer</a><a class="btn out sm" href="https://wa.me/${d.wa.replace(/\D/g, '')}" target="_blank" rel="noopener">${I('wa','sm')} WhatsApp Dealer</a></div><div class="xs muted num" style="user-select:all">${d.phone} · ${d.wa}</div>`
    : role === 'dealer' ? (showC ? `<div class="contact-row"><a class="btn out sm" href="tel:${c.phone.replace(/\s/g, '')}">${I('phone','sm')} Call Customer</a><a class="btn out sm" href="https://wa.me/${c.phone.replace(/\D/g, '')}" target="_blank" rel="noopener">${I('wa','sm')} WhatsApp Customer</a></div><div class="xs muted num" style="user-select:all">${c.phone}</div>` : `<p class="xs muted">Customer contact details are hidden for ${D_LABEL[r.status].toLowerCase()} requests under the lead-access rules.</p>`) : '';
  const reports = (role === 'admin' || r.cRep || r.dRep) && r.fbAt ? `<div class="kv" style="background:var(--surface-2);border-radius:12px;padding:12px"><div class="k">Customer report</div><div class="small">${role === 'dealer' && !isA() ? (r.cRep ? 'Submitted' : 'Not submitted') : cRepText(r.cRep)}</div><div class="k">Dealer report</div><div class="small">${role === 'customer' ? (r.dRep ? 'Submitted' : 'Not submitted') : dRepText(r.dRep)}</div></div>` : '';
  let acts = '';
  if (role === 'dealer' && r.status === 'pending') acts = `<button class="btn dano" data-a="dReject" data-id="${r.id}" data-close>Reject</button><button class="btn pri" data-a="dConfirm" data-id="${r.id}" data-close>Confirm</button>`;
  if (role === 'customer' && r.status === 'pending') acts = `${r.rescheduled ? '' : `<button class="btn out" data-a="cResched" data-id="${r.id}" data-close>Reschedule</button>`}<button class="btn dano" data-a="cCancel" data-id="${r.id}" data-close>Cancel Request</button>`;
  if (r.status === 'confirmed' && S.now < r.slot && role !== 'admin') acts = `<button class="btn dano" data-a="${role === 'dealer' ? 'dCancel' : 'cCancel'}" data-id="${r.id}" data-close>Cancel Test Drive</button>`;
  if (role !== 'admin' && canSurvey(r, role)) acts = `<button class="btn pri" data-a="survey" data-id="${r.id}" data-close>${role === 'dealer' ? 'Update Appointment' : 'Share Feedback'}</button>`;
  if (role !== 'admin' && r.fbAt && !S.cases.some(k => k.rid === r.id && k.type === 'dispute' && k.by === role) && (r.cRep || r.dRep)) acts += `<button class="btn out" data-a="dispute" data-id="${r.id}" data-close>Report Inaccurate Outcome</button>`;
  if (role === 'admin'){ const k = S.cases.find(x => x.rid === r.id && x.status === 'open'); if (k) acts = `<button class="btn pri" data-a="caseOpen" data-id="${k.id}" data-close>Open Review</button>`; }
  modal({size:'lg', title:esc(carName(l)), sub:`${pill(r, role === 'customer' ? 'customer' : 'dealer')} <span class="xs muted">Ref ${r.id.toUpperCase()}</span>`, body:`<img src="${carImg(l.color)}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">${banner}<div class="kv">${kv.map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('')}</div>${reports}${contact}
    <details><summary class="small" style="cursor:pointer;font-weight:600">History (${r.log.length})</summary><div class="log" style="margin-top:10px">${r.log.slice().sort((a, b) => a.at - b.at).map(x => `<div><div class="t">${fmtDTY(x.at)}</div>${esc(x.text)}</div>`).join('')}</div></details>`,
    foot: acts || '<button class="btn out" data-close>Close</button>'});
}

/* ============ Dealer decisions (Part 11) ============ */
function dConfirmFlow(rid){
  const r = R(rid);
  if (r.status !== 'pending') return toast('This request is no longer pending.');
  confirmModal({title:'Confirm Test Drive?', text:`Confirm ${esc(C(r.cid).name)}'s test drive of ${esc(carName(L(r.lid)))} on ${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}? The customer will be notified.`, ok:'Confirm Appointment',
    onOk(){ const res = dealerConfirm(rid); commit(); if (res.err === 'expired') infoModal({title:'Request Expired', text:'The response deadline has passed. This request can no longer be confirmed.', icon:'clock', tone:'am'}); else if (res.err) toast('This request can no longer be confirmed.'); else toast('Appointment confirmed. The customer has been notified.'); }});
}
function dRejectFlow(rid){
  const r = R(rid);
  if (r.status !== 'pending') return toast('This request is no longer pending.');
  modal({title:'Reject Request', sub:`${esc(C(r.cid).name)} · ${esc(carName(L(r.lid)))} · ${fmtDT(r.slot)}`, body:`${reasonFields(REJECT_REASONS)}<label class="chk" data-ls hidden><input type="checkbox" id="ls-cb" checked><span>Also update the listing status. Other pending requests for this car will close and future confirmed appointments will be cancelled.</span></label>`, split:true,
    foot:`<button class="btn out" data-close>Go Back</button><button class="btn dan" data-m="ok" disabled>Reject Request</button>`,
    mount(m){ const ok = m.foot.querySelector('[data-m=ok]'), ls = m.body.querySelector('[data-ls]');
      const get = wireReasons(m.body, 'rsn', () => { const v = get(); ok.disabled = !v; const sel = m.body.querySelector('input[name=rsn]:checked'); ls.hidden = !sel || !['Vehicle Sold','Vehicle Reserved'].includes(sel.value); });
      ok.onclick = () => { const v = get(); if (!v) return; const la = !ls.hidden && m.body.querySelector('#ls-cb').checked ? (v.reason === 'Vehicle Sold' ? 'sold' : 'reserved') : null;
        const res = dealerReject(rid, v.reason, v.text, la); m.close(); commit(); toast(res.err ? 'This request can no longer be rejected.' : 'Request declined. The customer has been notified.'); }; }});
}

/* ============ Cancellation (Part 12) ============ */
function cCancelFlow(rid){
  const r = R(rid);
  if (!ACTIVE(r) || S.now >= r.slot) return toast('This appointment can no longer be cancelled.');
  modal({size:'sm', title:'Cancel Test Drive?', sub:`${esc(carName(L(r.lid)))} · ${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}`, body:`<p class="muted small">The dealership will be notified immediately.</p>${reasonFields(C_CANCEL)}`, split:true,
    foot:`<button class="btn out" data-close>Keep Appointment</button><button class="btn dan" data-m="ok" disabled>Cancel Test Drive</button>`,
    mount(m){ const ok = m.foot.querySelector('[data-m=ok]'); const get = wireReasons(m.body, 'rsn', () => ok.disabled = !get());
      ok.onclick = () => { const v = get(); const res = customerCancel(rid, v.reason, v.text); m.close(); commit(); toast(res.err ? 'This appointment can no longer be cancelled.' : 'Your test drive has been cancelled.'); }; }});
}
function dCancelFlow(rid){
  const r = R(rid);
  if (r.status !== 'confirmed') return toast('Use Reject for pending requests.');
  if (S.now >= r.slot) return infoModal({title:'Appointment Has Started', text:'Normal cancellation is unavailable after the start time. Please report the outcome once the feedback request arrives.', icon:'info'});
  const late = r.slot - S.now <= 2 * HOUR, c = C(r.cid);
  const body = late ? `<div class="banner am">${I('alert')}<div><div class="t">This appointment starts in less than 2 hours.</div><div>The customer may already be travelling to your dealership. Please contact the customer directly before cancelling.</div></div></div>
      <div class="contact-row"><a class="btn out" href="tel:${c.phone.replace(/\s/g, '')}">${I('phone','sm')} Call Customer</a><a class="btn out" href="https://wa.me/${c.phone.replace(/\D/g, '')}" target="_blank" rel="noopener">${I('wa','sm')} WhatsApp Customer</a></div><div class="small num" style="user-select:all">${esc(c.name)} · ${c.phone}</div>
      <label class="chk"><input type="checkbox" id="ack-cb"><span>I confirm that I have attempted to contact the customer about this cancellation.</span></label>${reasonFields(D_CANCEL)}`
    : `<p class="muted small">Are you sure you want to cancel this confirmed test drive? The customer will be notified immediately.</p>${reasonFields(D_CANCEL)}`;
  modal({title: late ? 'Customer Contact Required' : 'Cancel Test Drive?', sub:`${esc(c.name)} · ${esc(carName(L(r.lid)))} · ${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}`, body, split:true,
    foot:`<button class="btn out" data-close>Keep Appointment</button><button class="btn dan" data-m="ok" disabled>Cancel Test Drive</button>`,
    mount(m){ const ok = m.foot.querySelector('[data-m=ok]'), ack = m.body.querySelector('#ack-cb');
      const upd = () => ok.disabled = !get() || (ack && !ack.checked); const get = wireReasons(m.body, 'rsn', upd); if (ack) ack.onchange = upd;
      ok.onclick = () => { const v = get(); const res = dealerCancel(rid, v.reason, v.text, ack && ack.checked); m.close(); commit(); toast(res.err ? 'This appointment can no longer be cancelled.' : 'Appointment cancelled. The customer has been notified.'); }; }});
}

/* ============ Feedback surveys (Parts 21–23) ============ */
function surveyFlow(rid){
  const r = R(rid); if (!r) return;
  const party = isC() && r.cid === ses().id ? 'customer' : isD() && r.did === ses().id ? 'dealer' : null;
  if (!party){
    const who = [C(r.cid), D(r.did)];
    if (isG()) return modal({size:'sm', title:'Log in to continue', sub:'This survey is available only to the customer and dealership for this appointment. You\'ll return to it after logging in.', body:`<div style="display:flex;flex-direction:column;gap:8px"><button class="btn out" data-m="c">Log in as ${esc(who[0].name)}</button><button class="btn out" data-m="d">Log in as ${esc(who[1].name)}</button></div>`, foot:'',
      mount(m){ m.body.querySelector('[data-m=c]').onclick = () => { m.close(); switchSession('customer', r.cid); setTimeout(() => surveyFlow(rid), 30); }; m.body.querySelector('[data-m=d]').onclick = () => { m.close(); switchSession('dealer', r.did); setTimeout(() => surveyFlow(rid), 30); }; }});
    return toast("You're not authorised to open this survey.");
  }
  if (!r.fbAt) return openReq(rid);
  if ((party === 'customer' ? r.cRep : r.dRep)){ toast('Feedback already submitted for this appointment.'); return openReq(rid); }
  const l = L(r.lid), d = D(r.did), c = C(r.cid), a = {};
  const q = (key, label, opts) => `<div class="fld"><label>${label}</label><div style="display:flex;flex-direction:column;gap:6px">${opts.map(([v, t]) => `<label class="opt ${a[key] === v ? 'on' : ''}"><input type="radio" name="${key}" value="${esc(v)}" ${a[key] === v ? 'checked' : ''}><div class="t">${t}</div></label>`).join('')}</div></div>`;
  const other = key => a[key] === 'Other Reason' ? `<div class="fld"><label for="oth">Tell us more</label><textarea id="oth" maxlength="150" placeholder="Maximum 150 characters">${esc(a.otherText || '')}</textarea><div class="cnt-lim"><span data-cnt>${(a.otherText || '').length}</span>/150</div></div>` : '';
  const YN = [['yes','Yes'],['no','No']];
  const build = () => {
    let h = '';
    if (party === 'customer'){
      h += q('visited', 'Did you visit the dealership?', YN);
      if (a.visited === 'yes'){ h += q('carAvailable', 'Was the car available for your appointment?', [['yes','Yes, the car was available'],['no','No, the car was unavailable']]);
        if (a.carAvailable === 'yes'){ h += q('completed', 'Did you complete the test drive?', YN);
          if (a.completed === 'no'){ h += q('whyNoDrive', "Why didn't the test drive take place?", [['Dealership could not accommodate the test drive','Dealership could not accommodate the test drive'],['I decided not to proceed','I decided not to proceed'],['Other Reason','Other Reason']]); h += other('whyNoDrive'); } } }
      if (a.visited === 'no'){ h += q('whyNot', "Why didn't you attend?", [['I cancelled beforehand','I cancelled beforehand'],["I couldn't attend","I couldn't attend"],['The dealership cancelled or asked me not to come','The dealership cancelled or asked me not to come'],['Other Reason','Other Reason']]); h += other('whyNot'); }
    } else {
      h += q('attended', 'Did the customer attend?', YN);
      if (a.attended === 'yes'){ h += q('tookPlace', 'Did the test drive take place?', YN);
        if (a.tookPlace === 'no'){ h += q('reason', "Why didn't the test drive take place?", [['Customer decided not to proceed','Customer decided not to proceed'],['Vehicle unavailable','Vehicle unavailable'],['Dealership unable to accommodate','Dealership unable to accommodate'],['Other Reason','Other Reason']]); h += other('reason'); } }
      if (a.attended === 'no') h += q('notified', 'Did the customer notify you beforehand?', YN);
    }
    return h;
  };
  const valid = () => {
    const needOther = ['whyNoDrive','whyNot','reason'].some(k => a[k] === 'Other Reason');
    if (needOther && !(a.otherText || '').trim()) return false;
    if (party === 'customer') return a.visited === 'no' ? !!a.whyNot : a.visited === 'yes' && (a.carAvailable === 'no' || (a.carAvailable === 'yes' && (a.completed === 'yes' || (a.completed === 'no' && !!a.whyNoDrive))));
    return a.attended === 'no' ? !!a.notified : a.attended === 'yes' && (a.tookPlace === 'yes' || (a.tookPlace === 'no' && !!a.reason));
  };
  const title = party === 'customer' ? 'How Was Your Test Drive Appointment?' : 'How Did the Test Drive Appointment Go?';
  const sub = party === 'customer' ? `Your appointment for ${esc(carName(l))} at ${esc(d.name)} was scheduled for ${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}.` : `Your appointment with ${esc(c.name)} for ${esc(carName(l))} was scheduled for ${fmtDayLong(r.slot)} at ${fmtTime(r.slot)}.`;
  const m = modal({title, sub, body:'', foot:`<button class="btn out" data-close>Close</button><button class="btn pri" data-m="ok" disabled>Submit Feedback</button>`});
  const draw = () => {
    m.body.innerHTML = `<div class="sumcar"><img src="${carImg(l.color)}" alt=""><div><div style="font-weight:600">${esc(carName(l))}</div><div class="small muted">${esc(d.name)} · ${fmtDT(r.slot)}</div></div></div>${build()}<p class="xs muted">Feedback is optional and can be submitted once. You can close this and come back from the appointment details.</p>`;
    m.body.querySelectorAll('input[type=radio]').forEach(i => i.onchange = () => {
      a[i.name] = i.value;
      const clear = {visited:['carAvailable','completed','whyNoDrive','whyNot','otherText'], carAvailable:['completed','whyNoDrive','otherText'], completed:['whyNoDrive','otherText'], attended:['tookPlace','reason','notified','otherText'], tookPlace:['reason','otherText']}[i.name] || [];
      clear.forEach(k => delete a[k]); draw();
    });
    const ta = m.body.querySelector('#oth'); if (ta) ta.oninput = () => { a.otherText = ta.value; m.body.querySelector('[data-cnt]').textContent = ta.value.length; m.foot.querySelector('[data-m=ok]').disabled = !valid(); };
    m.foot.querySelector('[data-m=ok]').disabled = !valid();
  };
  m.foot.querySelector('[data-m=ok]').onclick = () => {
    if (!valid()) return;
    const rep = {...a}; if (rep.otherText) rep.otherText = rep.otherText.trim().slice(0, 150);
    const res = submitSurvey(rid, party, rep); m.close(); commit();
    if (res.err) return toast('Feedback already submitted.');
    infoModal({title:'Feedback Submitted', text:'Thank you. Your feedback has been recorded.', icon:'check', tone:'gr', ok:'Done'});
  };
  draw();
}
function disputeFlow(rid){
  const r = R(rid), by = isC() ? 'customer' : isD() ? 'dealer' : null;
  if (!by || !canSee(r)) return toast('Log in as a party to this appointment to dispute it.');
  modal({size:'sm', title:'Report Inaccurate Outcome', sub:`${esc(carName(L(r.lid)))} · ${fmtDT(r.slot)}`, body:`<p class="small muted">Tell us what actually happened. No evidence upload is needed; our team will review both sides.</p><div class="fld"><label for="dsp">What happened?</label><textarea id="dsp" maxlength="300" placeholder="e.g. I attended at 4 PM but the car had been moved to another branch."></textarea></div>`, split:true,
    foot:`<button class="btn out" data-close>Cancel</button><button class="btn pri" data-m="ok">Submit Dispute</button>`,
    mount(m){ m.foot.querySelector('[data-m=ok]').onclick = () => { const t = m.body.querySelector('#dsp').value.trim(); if (t.length < 5) return toast('Please describe what happened.'); const res = openDispute(rid, by, t); m.close(); commit(); toast(res.err ? 'You already have an open dispute for this appointment.' : 'Dispute submitted for review.'); }; }});
}

/* ============ Switches & working hours (Parts 2, 3.5) ============ */
function keepCancelBody(p, c, scope){
  return `<p class="muted">${scope === 'master' ? `You currently have ${p} pending requests and ${c} confirmed appointments. Disabling test drives will stop new requests and automatically cancel your pending requests.` : scope === 'listing' ? `This car currently has ${p} pending requests and ${c} confirmed appointments. Disabling test drives will stop new requests and automatically cancel pending requests for this car.` : `Your changes will affect ${p} pending requests and ${c} confirmed appointments. The affected pending requests will be automatically cancelled.`}${c ? ' What would you like to do with the confirmed appointments?' : ''}</p>
    ${c ? `<label class="opt on"><input type="radio" name="kc" value="keep" checked><div><div class="t">Keep Confirmed Appointments (Recommended)</div><div class="d">Existing confirmed appointments remain scheduled.</div></div></label>
    <label class="opt"><input type="radio" name="kc" value="cancel"><div><div class="t">Cancel Confirmed Appointments</div><div class="d">Affected customers are notified. A reason is required.</div></div></label>
    <div data-cr hidden>${reasonFields(D_CANCEL, 'cr')}</div>` : ''}`;
}
function wireKeepCancel(m){
  const cr = m.body.querySelector('[data-cr]'); if (!cr) return () => ({cancel:false});
  const get = wireReasons(cr, 'cr');
  m.body.querySelectorAll('input[name=kc]').forEach(i => i.onchange = () => { m.body.querySelectorAll('input[name=kc]').forEach(j => j.closest('.opt').classList.toggle('on', j.checked)); cr.hidden = i.value !== 'cancel' || !i.checked; });
  return () => { const v = m.body.querySelector('input[name=kc]:checked').value; if (v === 'keep') return {cancel:false}; const rr = get(); if (!rr) return null; return {cancel:true, reason: rr.reason === 'Other Reason' ? 'Other: ' + rr.text : rr.reason}; };
}
function masterFlow(on){
  const d = meD();
  if (on){ setMaster(d.id, true); commit(); toast('Test drive requests enabled.'); return; }
  const a = affectedBy(r => r.did === d.id);
  if (!a.pending.length && !a.confirmed.length){ setMaster(d.id, false); commit(); toast('Test drive requests disabled.'); return; }
  const snap = `${a.pending.length}/${a.confirmed.length}`;
  modal({title:'Disable Test Drive Requests?', body:keepCancelBody(a.pending.length, a.confirmed.length, 'master'), split:true, onClose:() => render(),
    foot:`<button class="btn out" data-close>Keep Enabled</button><button class="btn dan" data-m="ok">Disable Test Drives</button>`,
    mount(m){ const get = wireKeepCancel(m); m.foot.querySelector('[data-m=ok]').onclick = () => {
      const v = get(); if (!v) return toast('Choose a cancellation reason.');
      const b = affectedBy(r => r.did === d.id); if (`${b.pending.length}/${b.confirmed.length}` !== snap){ m.close(); toast('The affected appointments changed. Please review again.'); return masterFlow(false); }
      setMaster(d.id, false, v.cancel, v.reason); m.close(); commit(); toast('Test drive requests disabled. Affected customers were notified.'); }; }});
}
function listingSwitchFlow(lid, on){

function validHours(h){

    ${disputes.length ? disputes.map(x => `<div class="note bl">${I('msg','sm')}<span><b>${x.by === 'customer' ? 'Customer' : 'Dealer'} dispute:</b> ${esc(x.text)}</span></div>`).join('') : ''}`
    : `<div class="note vi">${I('flag','sm')}<span>${esc(k.text)}</span></div><div class="stat"><div class="k">Incident history · ${esc(k.party === 'customer' ? C(k.pid).name : D(k.pid).name)}</div>${inc(k.party, k.pid)}</div>`;
